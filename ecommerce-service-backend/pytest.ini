[pytest]
# Pytest 配置 - Commerce Backend

# 测试目录
testpaths = tests

# Python 文件和函数模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出选项
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Asyncio 模式
asyncio_mode = auto

# 标记定义
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (requires database)
    e2e: End-to-end tests (requires full environment)
    slow: Slow tests
    auth: Authentication and JWT tests
    catalog: Catalog API tests
    s001: Step S001 - Dependencies and baseline
    s002: Step S002 - Config and test DB isolation
    s005: Step S005 - Logging and health checks
    s009: Step S009 - JWT signing and verification
    g00: Gate G00 - Foundation baseline
    g01: Gate G01 - User domain
    g02: Gate G02 - Catalog and SKU

# 日志
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 覆盖率（可选）
# addopts = --cov=app --cov-report=html --cov-report=term
