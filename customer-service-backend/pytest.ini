[pytest]
# Pytest configuration - Agent Backend

# Test directories
testpaths = tests

# Python file and function patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Asyncio mode
asyncio_mode = auto

# Marker definitions
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (requires database, Redis)
    e2e: End-to-end tests (requires Commerce backend)
    slow: Slow tests
    graph: LangGraph tests
    intent: Intent classification tests
    tool: Tool runtime tests
    flow: Flow execution tests
    s001: Step S001 - Dependencies and baseline
    s003: Step S003 - Agent config and dependencies
    s005: Step S005 - Logging and health checks
    s016: Step S016 - JWT verification
    s020: Step S020 - Turn lock
    s021: Step S021 - Graph builder
    s022: Step S022 - State management
    s023: Step S023 - Five-node integration
    s024: Step S024 - Intent policy
    s031: Step S031 - Chat API integration
    g02: Gate G02 - Foundation complete
    g03: Gate G03 - Basic flows
    g04: Gate G04 - Product and promotion

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage (optional)
# addopts = --cov=customer_service --cov-report=html --cov-report=term
